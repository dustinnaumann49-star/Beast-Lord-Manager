<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beast Lord Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #e0e0e0; }
    .fc-dark { background-color: #2a2a2a; color: #fff; border: 1px solid #444; }
  </style>
</head>
<body>
<div class="container py-3">
  <h4 class="text-warning">Beast Lord Manager</h4>
  <div id="ownTeamEditor" class="card p-3 bg-dark border-secondary"></div>
  <div id="simResult" class="mt-3"></div>
</div>

<script>
  let beasts = [], alphas = [], config = { token: localStorage.getItem('gh_token'), user: localStorage.getItem('gh_user'), repo: 'Beast-Lord-Manager' };

  async function init() {
    if(!config.token) return;
    const bRes = await githubFetch('beasts.json'); beasts = bRes.data || [];
    const aRes = await githubFetch('alphas.json'); alphas = aRes.data || [];
    renderEditors();
  }

  function renderEditors() {
    let html = `<h5 class="text-primary">🟦 Dein Team</h5>`;
    for(let i=1; i<=3; i++) {
      html += `<select class="form-select fc-dark mb-2" id="own-alpha-${i}" onchange="updateAnalysis()">
                <option value="">-- Alpha wählen --</option>
                ${alphas.map((a,idx)=>`<option value="${idx}">${a.name}</option>`).join('')}
               </select>`;
    }
    html += `<div id="own-analysis" class="mt-2 text-info small"></div>`;
    document.getElementById('ownTeamEditor').innerHTML = html;
  }

  function updateAnalysis() {
    let container = document.getElementById('own-analysis');
    let html = `<strong>Analyse:</strong><br>`;
    for(let i=1; i<=3; i++) {
      let val = document.getElementById('own-alpha-'+i).value;
      if(val !== "") {
        let a = alphas[val];
        // Sichere Prüfung: Gibt es Skills?
        if(a && a.skills && Array.isArray(a.skills)) {
          html += `👑 ${a.name}: ${a.skills.map(s => s.name).join(', ')}<br>`;
        } else {
          html += `👑 ${a.name}: (Keine Skills geladen)<br>`;
        }
      }
    }
    container.innerHTML = html;
  }

  async function githubFetch(f) {
    try {
      const res = await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/${f}`, {
        headers: {'Authorization': 'token '+config.token}
      });
      const json = await res.json();
      return { data: JSON.parse(decodeURIComponent(escape(atob(json.content)))) };
    } catch(e) { return { data: [] }; }
  }

  window.onload = init;
</script>
</body>
</html>
