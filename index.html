<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beast Lord Kampf-Sim</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 15px; }
    .box { border: 1px solid #444; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: #1e1e1e; }
    .slot-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
    select, input { background: #333; color: #fff; border: 1px solid #555; padding: 6px; }
    button { background-color: #ffc107; color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }
    #result { margin-top: 15px; padding: 10px; border-top: 1px solid #333; color: #ffc107; }
    .label { font-size: 0.7em; color: #888; margin-bottom: 2px; }
  </style>
</head>
<body>
  <h3>🟦 Dein Team</h3>
  <div class="box" id="teamContainer"></div>
  <button onclick="calculateBattle()">⚔️ Kampf berechnen</button>
  <div id="result"></div>

  <script>
    const alphas = ["Hyaenodon"];
    const beasts = [
      { name: "Nordwestlicher Wolf", atk: 105, def: 49, hp: 13 },
      { name: "Sumatra-Orang-Utan", atk: 87, def: 49, hp: 18 },
      { name: "Takin", atk: 70, def: 73, hp: 20 }
    ];

    function initUI() {
      const container = document.getElementById('teamContainer');
      let html = "";
      for(let i=1; i<=3; i++) {
        html += `
          <div class="label">Reihe ${i}</div>
          <div class="slot-row">
            <select id="alpha-${i}">${alphas.map(a => `<option value="${a}">${a}</option>`).join('')}</select>
            <select id="beast-${i}">${beasts.map(b => `<option value="${b.name}">${b.name}</option>`).join('')}</select>
            <input type="number" id="count-${i}" placeholder="Anzahl" value="1000">
          </div>`;
      }
      container.innerHTML = html;
    }

    function calculateBattle() {
      let totalAtk = 0, totalDef = 0, totalHP = 0;
      let log = "<strong>Kampf-Analyse:</strong><br>";
      
      for(let i=1; i<=3; i++) {
        let alpha = document.getElementById(`alpha-${i}`).value;
        let bName = document.getElementById(`beast-${i}`).value;
        let count = parseInt(document.getElementById(`count-${i}`).value) || 0;
        let b = beasts.find(obj => obj.name === bName);
        
        let rowAtk = b.atk * count;
        let rowDef = b.def * count;
        let rowHP = b.hp * count;
        
        totalAtk += rowAtk;
        totalDef += rowDef;
        totalHP += rowHP;
        
        log += `${count}x ${bName} (angeführt von ${alpha})<br>`;
      }
      
      document.getElementById('result').innerHTML = log + `
        <br><strong>Gesamt-Stärke:</strong><br>
        Angriff: ${totalAtk.toLocaleString()}<br>
        Verteidigung: ${totalDef.toLocaleString()}<br>
        HP: ${totalHP.toLocaleString()}
      `;
    }
    initUI();
  </script>
</body>
</html>
