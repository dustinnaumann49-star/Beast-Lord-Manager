<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clan Kampf-Simulator 3v3</title>
    <script src="data/alphas/carnivores.js"></script>
    <script src="data/alphas/herbivores.js"></script>
    <script src="data/alphas/omnivores.js"></script>
    <script src="data/troops/carnivore_troops.js"></script>
    <script src="data/troops/herbivore_troops.js"></script>
    <script src="data/troops/omnivore_troops.js"></script>
    <script src="engine/gameEngine.js"></script>
    <script src="engine/battleManager.js"></script>
</head>
<body>
    <h1>Kampf-Simulator 3v3</h1>
    <div id="p1" class="slot"></div><div id="p2" class="slot"></div><div id="p3" class="slot"></div>
    <div id="e1" class="slot"></div><div id="e2" class="slot"></div><div id="e3" class="slot"></div>
    <button id="kampfBtn" style="padding:20px; width:100%; background:green; color:white;">KAMPF STARTEN</button>

    <script>
        // 1. Setup der Slots
        const allAlphas = { ...window.CarnivoreAlphas, ...window.Herbivores, ...window.Omnivores };
        const troopMapping = { "Fleischfresser": window.CarnivoreTroops, "Pflanzenfresser": window.HerbivoreTroops, "Allesfresser": window.OmnivoreTroops };
        
        ['p1','p2','p3','e1','e2','e3'].forEach(id => {
            document.getElementById(id).innerHTML = 
                `<select class="aSel"><option value="">Alpha</option></select>
                 <select class="tSel"><option value="">Truppe</option></select>
                 <input type="number" class="cIn" value="10">`;
            
            const aSel = document.getElementById(id).querySelector('.aSel');
            Object.keys(allAlphas).forEach(name => {
                let o = new Option(name, name);
                o.dataset.class = allAlphas[name].class;
                aSel.add(o);
            });

            aSel.onchange = function() {
                const tSel = document.getElementById(id).querySelector('.tSel');
                tSel.innerHTML = '<option value="">Truppe</option>';
                const cls = this.options[this.selectedIndex].dataset.class;
                if(troopMapping[cls]) {
                    Object.keys(troopMapping[cls]).forEach(tier => {
                        Object.keys(troopMapping[cls][tier]).forEach(t => tSel.add(new Option(t, t)));
                    });
                }
            };
        });

        // 2. Klick-Event (Direkt am Button)
        document.getElementById('kampfBtn').onclick = function() {
            alert("Klick erkannt! Prüfe jetzt BattleManager...");
            
            if(typeof window.BattleManager === 'undefined') {
                alert("FEHLER: BattleManager nicht gefunden!");
                return;
            }

            // Daten sammeln
            const getTeam = (ids) => ids.map(id => ({
                alpha: document.getElementById(id).querySelector('.aSel').value,
                troop: document.getElementById(id).querySelector('.tSel').value,
                count: parseInt(document.getElementById(id).querySelector('.cIn').value)
            }));

            const pTeam = getTeam(['p1','p2','p3']);
            const eTeam = getTeam(['e1','e2','e3']);

            try {
                const res = window.BattleManager.runBattle(pTeam, eTeam);
                alert("Ergebnis: " + res);
            } catch(e) {
                alert("Fehler in runBattle: " + e.message);
            }
        };
    </script>
</body>
</html>
