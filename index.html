<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VCF Beast Synergie</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d8c000">

    <style>
        :root {
            --bg: #0e0e1a;
            --surface: #14142a;
            --card: #1a1a30;
            --accent: #e2a03f;
            --text: #e8dfd0;
            --text-muted: #7a7085;
            --border: rgba(255,255,255,0.07);
            --carnivore: #e74c3c;
            --omnivore: #f0b830;
            --herbivore: #2ecc71;
            --melee: #e67e22;
            --ranged: #5dade2;
            --support: #58d68d;
            --success: #2ecc71;
            --error: #e74c3c;
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% -10%, rgba(226,160,63,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 100% 80%, rgba(192,57,43,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 0% 80%, rgba(39,174,96,0.04) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 16px 12px 40px;
        }

        #mainTool {
            width: 100%;
            max-width: 660px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ================================
           APP HEADER
        ================================ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: var(--radius);
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon { font-size: 1.7rem; line-height: 1; }

        .brand-text h1 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.02em;
        }

        .brand-sub {
            font-size: 0.68rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .lang-switch { display: flex; gap: 4px; }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .lang-btn.active {
            background: var(--accent);
            color: #0e0e1a;
            border-color: var(--accent);
        }

        /* ================================
           MODULE CARDS
        ================================ */
        .module-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .module-header {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.015);
        }

        .mod-icon { font-size: 1.1rem; }

        .module-header h2 {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.09em;
        }

        .mod-desc {
            margin-left: auto;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .module-body { padding: 18px; }

        /* ================================
           FORM ELEMENTS
        ================================ */
        .form-group { margin-bottom: 14px; }
        .form-group:last-child { margin-bottom: 0; }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-bottom: 6px;
        }

        .select-wrapper { position: relative; }

        select {
            width: 100%;
            padding: 12px 40px 12px 14px;
            font-size: 0.92rem;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-weight: 500;
        }

        select:hover { border-color: rgba(255,255,255,0.14); }

        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(226,160,63,0.12);
        }

        select:disabled { opacity: 0.35; cursor: not-allowed; }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 1rem;
            pointer-events: none;
        }

        select option { background: #1a1a30; color: var(--text); }
        select option:first-child { color: var(--text-muted); }

        #alphaGroup, #beastGroup { display: none; }
        #alphaGroup.visible, #beastGroup.visible { display: block; }

        /* ================================
           RESULT BOX
        ================================ */
        .result-box {
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 22px 16px;
            text-align: center;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin-top: 14px;
        }

        .result-box.active { border-style: solid; }

        .result-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }

        .result-emoji {
            font-size: 2rem;
            line-height: 1;
            animation: popIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-type {
            font-size: 0.67rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.75;
        }

        .result-alpha-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .result-tags {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 3px;
        }

        .result-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
        }

        .result-tag.beast { color: #b0a080; border-color: rgba(176,160,128,0.2); }

        .placeholder-text { color: var(--text-muted); font-size: 0.85rem; font-style: italic; }

        .type-carnivore { border-color: rgba(231,76,60,0.28) !important; box-shadow: 0 0 20px rgba(231,76,60,0.05); }
        .type-omnivore  { border-color: rgba(240,184,48,0.28) !important; box-shadow: 0 0 20px rgba(240,184,48,0.05); }
        .type-herbivore { border-color: rgba(46,204,113,0.28) !important; box-shadow: 0 0 20px rgba(46,204,113,0.05); }

        .type-carnivore .result-type { color: var(--carnivore); }
        .type-omnivore  .result-type { color: var(--omnivore); }
        .type-herbivore .result-type { color: var(--herbivore); }

        .position-melee   .result-tag.pos { color: var(--melee);   border-color: rgba(230,126,34,0.28); }
        .position-ranged  .result-tag.pos { color: var(--ranged);  border-color: rgba(93,173,226,0.28); }
        .position-support .result-tag.pos { color: var(--support); border-color: rgba(88,214,141,0.28); }

        /* ================================
           FORMATION TRAINER
        ================================ */
        .formation-grid {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .formation-row {
            display: grid;
            grid-template-columns: 54px 1fr 32px;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 11px 13px;
            transition: border-color 0.25s;
        }

        .row-label {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            white-space: nowrap;
        }

        .row-select { display: flex; flex-direction: column; gap: 3px; }

        .formation-select {
            width: 100%;
            padding: 8px 32px 8px 11px !important;
            font-size: 0.85rem !important;
            font-family: inherit;
            color: var(--text) !important;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .formation-select:focus { outline: none; border-color: var(--accent); }
        .formation-select option { color: var(--text); background: #1a1a30; }

        .row-feedback { font-size: 0.68rem; color: var(--error); display: none; }
        .row-feedback.visible { display: block; }

        .row-status { font-size: 1.15rem; line-height: 1; text-align: center; }

        .formation-row.valid-highlight   { border-color: rgba(46,204,113,0.3); }
        .formation-row.invalid-highlight { border-color: rgba(231,76,60,0.3); }

        /* ================================
           FOOTER
        ================================ */
        .app-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.65rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 4px;
            opacity: 0.4;
        }
    </style>
</head>

            Support:  {icon:'🛡️',cssClass:'position-support'}
        };

        const typeSelect  = document.getElementById('typeSelect');
        const alphaGroup  = document.getElementById('alphaGroup');
        const beastGroup  = document.getElementById('beastGroup');
        const alphaSelect = document.getElementById('alphaSelect');
        const beastSelect = document.getElementById('beastSelect');
        const resultBox   = document.getElementById('resultBox');

        function populateTypeSelect() {
            const t = translations[currentLang];
            typeSelect.innerHTML = `<option value="" disabled selected>${t.typePlaceholder}</option>`;
            ['Fleischfresser','Allesfresser','Pflanzenfresser'].forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = typConfig[key].emoji + ' ' + t.types[key];
                typeSelect.appendChild(opt);
            });
        }

        function populateAlphaSelect(list) {
            const t = translations[currentLang];
            alphaSelect.innerHTML = `<option value="" disabled selected>${t.alphaPlaceholder}</option>`;
            (list||[]).forEach(a => {
                const opt = document.createElement('option');
                opt.value = a.name; opt.textContent = translateAlphaName(a.name);
                alphaSelect.appendChild(opt);
            });
        }

        function populateBeastSelect(list) {
            const t = translations[currentLang];
            beastSelect.innerHTML = `<option value="" disabled selected>${t.beastPlaceholder}</option>`;
            (list||[]).forEach(b => {
                const opt = document.createElement('option');
                opt.value = b; opt.textContent = translateBeastName(b);
                beastSelect.appendChild(opt);
            });
        }

        function updateResult() {
            const typ = typeSelect.value, alphaName = alphaSelect.value, beast = beastSelect.value;
            const t = translations[currentLang];
            if (!typ || !alphaName) {
                resultBox.className = 'result-box';
                resultBox.innerHTML = `<span class="placeholder-text">${t.resultPlaceholder}</span>`;
                return;
            }
            const alphaObj = alphaDaten[typ].find(a => a.name === alphaName);
            if (!alphaObj) return;
            const typInfo = typConfig[typ], posInfo = positionConfig[alphaObj.position];
            const dispAlpha = translateAlphaName(alphaName), dispBeast = beast ? translateBeastName(beast) : null;
            resultBox.className = `result-box active ${typInfo.cssClass} ${posInfo.cssClass}`;
            resultBox.innerHTML = `
                <div class="result-content">
                    <span class="result-emoji">${typInfo.emoji}</span>
                    <span class="result-type">${t.types[typ]}</span>
                    <span class="result-alpha-name">${dispAlpha}</span>
                    <div class="result-tags">
                        <span class="result-tag pos">${posInfo.icon} ${t.positions[alphaObj.position]}</span>
                        ${dispBeast ? `<span class="result-tag beast">🐾 ${dispBeast}</span>` : ''}
                    </div>
                </div>`;
        }

        typeSelect.addEventListener('change', function() {
            const typ = this.value;
            if (typ && alphaDaten[typ]) {
                populateAlphaSelect(alphaDaten[typ]);
                populateBeastSelect(beastDaten[typ]);
                alphaGroup.classList.add('visible');
                beastGroup.classList.add('visible');
            } else {
                alphaGroup.classList.remove('visible');
                beastGroup.classList.remove('visible');
            }
            updateResult();
        });

        alphaSelect.addEventListener('change', updateResult);
        beastSelect.addEventListener('change', updateResult);

        const recommendedRows = {
            'Berglöwe':[1,2],'Riesenkänguru':[2],'Breitmaulnashorn':[2,3],'Gepard':[2,3],
            'Sekretär':[2,3],'Strauß':[1],'Schuhschnabel':[1,2],'Kasuar':[2,3],
            'Leopard':[2,3],'Sibirischer Tiger':[2,3],'Giraffe':[1,2],'Löwe':[1,2],
            'Riesenelch':[1,2],'Hebriden-Schaf':[1],'Weißes Rentier':[2],'Yak':[2,3],
            'Doedicurus':[1],'Wollnashorn':[2,3],'Riesen Sivatherium':[1],'Meiolania':[2],
            'Wildpferd':[1],'Asiatischer Elefant':[1],'Rentier':[2],'Ankole':[2,3],
            'Spanisches Kampfrind':[1],'Geochelone':[2,3],'Spitzmaulnashorn':[1],
            'Afrikanischer Elefant':[2,3],'Mammut':[1],'Megatherium':[2,3],
            'Panzernashorn':[2,3],'Brabanter':[2,3],'Geierschildkröte':[1],
            'Klapperschlange':[1,2],'Komodowaran':[3],'Höhlenbär':[1],'Riesenbiber':[2],
            'Metridiochoerus':[2],'Dinopithecus':[2,3],'Schwarzbär':[2,3],
            'Pinselohrschwein':[1],'Weißkopfsaki':[2],'Bärenmarder':[2],'Drill':[1,2],
            'Flusspferd':[1],'Geisterbär':[2,3],'Südafrika-Kronenkranich':[2],
            'Weißer Pfau':[1],'Elefantenvogel':[1],'Kurznasenbär':[2],'Kodiakbär':[3],
            'Tibetdogge':[1],'Jaguarundi':[1,2],'Weißer Löwe':[2,3],'Titanis':[1,2],
            'Amerikanischer Löwe':[2],'Hyaenodon':[1,2],'Smilodon':[3],
            'Schwarzer Panther':[2,3],'Schneeleopard':[1,2],'Weißer Tiger':[2,3],
            'Kanadischer Luchs':[2],'Leistenkrokodil':[3],'Bindenwaran':[1],
            'Schwarzer Löwe':[2],'Weißes Krokodil':[2,3],'Affenadler':[1],
            'Beutellöwe':[1],'Amerikanischer Gepard':[2]
        };

        const formationAlphas = Object.keys(recommendedRows).sort((a,b)=>a.localeCompare(b));

        function buildFormationTrainer() {
            const container = document.getElementById('formationRows');
            container.innerHTML = '';
            const t = translations[currentLang].formation;
            for (let row=1; row<=3; row++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'formation-row';
                rowDiv.dataset.row = row;
                rowDiv.innerHTML = `
                    <div class="row-label">${t.rowLabel} ${row}</div>
                    <div class="row-select">
                        <div class="select-wrapper">
                            <select class="formation-select">
                                <option value="" disabled selected>${t.alphaPlaceholder}</option>
                                ${formationAlphas.map(n=>`<option value="${n}">${translateAlphaName(n)}</option>`).join('')}
                            </select>
                        </div>
                        <div class="row-feedback"></div>
                    </div>
                    <div class="row-status"></div>`;
                container.appendChild(rowDiv);
                rowDiv.querySelector('.formation-select').addEventListener('change', ()=>validateFormationRow(rowDiv, row));
            }
        }

        function validateFormationRow(rowDiv, rowNumber) {
            const select=rowDiv.querySelector('.formation-select'), statusDiv=rowDiv.querySelector('.row-status');
            const feedbackDiv=rowDiv.querySelector('.row-feedback'), t=translations[currentLang].formation;
            const alphaName=select.value;
            rowDiv.classList.remove('valid-highlight','invalid-highlight');
            statusDiv.textContent=''; feedbackDiv.classList.remove('visible');
            if (!alphaName) return;
            const rows=recommendedRows[alphaName]; if (!rows) return;
            if (rows.includes(rowNumber)) {
                statusDiv.textContent=t.correct; rowDiv.classList.add('valid-highlight');
            } else {
                statusDiv.textContent=t.incorrect; rowDiv.classList.add('invalid-highlight');
                feedbackDiv.textContent=`${t.recommended} ${rows.join(', ')}`; feedbackDiv.classList.add('visible');
            }
        }

        function updateStaticTexts() {
            const t = translations[currentLang];
            document.getElementById('mainTitle').textContent = t.title;
            document.getElementById('mainSubtitle').textContent = t.subtitle;
            document.getElementById('mainModDesc').textContent = t.modDesc;
            document.getElementById('labelType').textContent = t.typeLabel;
            document.getElementById('labelAlpha').textContent = t.alphaLabel;
            document.getElementById('labelBeast').textContent = t.beastLabel;
            document.getElementById('footerText').textContent = t.footer;
            document.getElementById('formationSubtitle').textContent = t.formation.subtitle;
            const ph = resultBox.querySelector('.placeholder-text');
            if (ph) ph.textContent = t.resultPlaceholder;
            document.querySelectorAll('.row-label').forEach((el,i) => el.textContent = t.formation.rowLabel+' '+(i+1));
            document.querySelectorAll('.formation-select').forEach(sel => {
                const ph2 = sel.querySelector('option[disabled]');
                if (ph2) ph2.textContent = t.formation.alphaPlaceholder;
                const cur = sel.value;
                Array.from(sel.options).forEach(opt => { if(opt.value) opt.textContent=translateAlphaName(opt.value); });
                sel.value = cur;
            });
        }

        function switchLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('#mainLangSwitch .lang-btn').forEach(btn =>
                btn.classList.toggle('active', btn.dataset.lang===lang));
            const savedType=typeSelect.value, savedAlpha=alphaSelect.value, savedBeast=beastSelect.value;
            updateStaticTexts(); populateTypeSelect(); typeSelect.value=savedType;
            if (savedType && alphaDaten[savedType]) {
                populateAlphaSelect(alphaDaten[savedType]); populateBeastSelect(beastDaten[savedType]);
                alphaGroup.classList.add('visible'); beastGroup.classList.add('visible');
            } else {
                alphaGroup.classList.remove('visible'); beastGroup.classList.remove('visible');
            }
            alphaSelect.value=savedAlpha; beastSelect.value=savedBeast; updateResult();
        }

        document.querySelectorAll('#mainLangSwitch .lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.dataset.lang !== currentLang) switchLanguage(this.dataset.lang);
            });
        });

        populateTypeSelect();
        buildFormationTrainer();
        updateStaticTexts();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(r => console.log('SW registered:', r.scope))
                    .catch(e => console.log('SW failed:', e));
            });
        }
    </script>
</body>
</html>
