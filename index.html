<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clan Kampf-Simulator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .input-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; width: 300px; }
        select, input { padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 12px 25px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Clan Kampf-Simulator</h1>

    <div class="input-group">
        <label>Dein Alpha:</label>
        <select id="pAlphaSelect"></select>
        <label>Deine Truppen:</label>
        <select id="pTroopSelect"></select>
    </div>

    <div class="input-group">
        <label>Gegner Alpha:</label>
        <select id="eAlphaSelect"></select>
        <label>Gegner Truppen:</label>
        <select id="eTroopSelect"></select>
    </div>

    <script type="module">
        import CarnivoreAlphas from './data/alphas/carnivores.js';
        import HerbivoreAlphas from './data/alphas/herbivores.js';
        import CarnivoreTroops from './data/troops/carnivore_troops.js';
        import HerbivoreTroops from './data/troops/herbivore_troops.js';

        // 1. Alle Alphas sammeln (mit Typ-Info)
        const allAlphas = {
            ...Object.keys(CarnivoreAlphas).map(k => ({ name: k, type: 'carnivore' })),
            ...Object.keys(HerbivoreAlphas).map(k => ({ name: k, type: 'herbivore' }))
        };

        // 2. Dropdowns initialisieren
        const pAlpha = document.getElementById('pAlphaSelect');
        const pTroop = document.getElementById('pTroopSelect');

        Object.values(allAlphas).forEach(a => {
            let opt = document.createElement('option');
            opt.textContent = a.name;
            opt.dataset.type = a.type; // Typ im Element speichern
            pAlpha.appendChild(opt);
        });

        // 3. Truppen-Update-Logik
        function updateTroops() {
            const selectedType = pAlpha.options[pAlpha.selectedIndex].dataset.type;
            pTroop.innerHTML = '';
            
            const source = (selectedType === 'carnivore') ? CarnivoreTroops : HerbivoreTroops;
            
            Object.keys(source["T10"]).forEach(troop => {
                let opt = document.createElement('option');
                opt.textContent = troop;
                pTroop.appendChild(opt);
            });
        }

        pAlpha.addEventListener('change', updateTroops);
        updateTroops(); // Initialer Call
    </script>
</body>
</html>
