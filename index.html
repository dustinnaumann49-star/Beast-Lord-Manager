<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clan Kampf-Simulator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .input-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; width: 300px; }
    </style>
</head>
<body>

    <h1>Clan Kampf-Simulator</h1>
    <div id="status">Lade Daten...</div>

    <div class="input-group">
        <label>Dein Alpha:</label>
        <select id="playerAlphaSelect"></select>
    </div>

    <script type="module">
        try {
            // Wir versuchen hier, nur EINE Datei zu importieren, um den Fehler einzugrenzen
            import CarnivoreAlphas from './data/alphas/carnivores.js';
            
            const pSelect = document.getElementById('playerAlphaSelect');
            pSelect.innerHTML = ''; // Leeren
            
            // Testweise einen Eintrag hinzufügen
            Object.keys(CarnivoreAlphas).forEach(name => {
                let opt = document.createElement('option');
                opt.textContent = name;
                pSelect.appendChild(opt);
            });
            
            document.getElementById('status').innerText = "Daten erfolgreich geladen!";
        } catch (err) {
            document.getElementById('status').innerText = "Fehler beim Laden: " + err.message;
            console.error(err);
        }
    </script>
</body>
</html>
