<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beast Lord Kampf-Sim</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; }
    th, td { border: 1px solid #334155; padding: 10px; text-align: center; }
    th { background: #334155; color: #fbbf24; }
    .dmg-highlight { color: #f87171; font-weight: bold; }
    .stat-row { font-size: 0.9em; }
  </style>
</head>
<body>
  <h3>Beast Lord Simulator (Alpha Report)</h3>
  <div id="setup">
    </div>
  <button onclick="simulate()">Kampf simulieren</button>
  <div id="report"></div>

  <script>
    function simulate() {
      let html = `
        <table>
          <tr>
            <th>Runde</th>
            <th>Alpha Aktion</th>
            <th>Schaden (Alpha)</th>
            <th>Truppen Rest</th>
          </tr>
      `;

      let units = 3000;
      for(let r = 1; r <= 5; r++) {
        let alphaDmg = Math.floor(Math.random() * 5000) + 2000;
        units -= Math.floor(alphaDmg / 100);
        
        html += `
          <tr class="stat-row">
            <td>${r}</td>
            <td>⚡ Tödlicher Comboschlag</td>
            <td class="dmg-highlight">${alphaDmg.toLocaleString()}</td>
            <td>${units} 🐾</td>
          </tr>
        `;
      }
      html += "</table>";
      document.getElementById('report').innerHTML = html;
    }
  </script>
</body>
</html>
