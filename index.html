<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beast Lord Kampf-Sim</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
    .box { border: 1px solid #444; padding: 15px; margin-top: 10px; border-radius: 8px; background: #1e1e1e; }
    .log { margin-top: 10px; font-size: 0.9em; color: #ffc107; }
  </style>
</head>
<body>
  <h1>Beast Lord Manager</h1>
  <div class="box">
    <select id="alphaSelect">
      <option value="Hyaenodon">Hyaenodon (S3)</option>
    </select>
    <button onclick="simulate()">Kampf simulieren</button>
    <div id="result" class="log"></div>
  </div>

  <script>
    function simulate() {
      const alpha = document.getElementById('alphaSelect').value;
      const resultDiv = document.getElementById('result');
      
      // Kampf-Logik
      let log = `<strong>Kampfbericht:</strong><br>`;
      
      if (alpha === "Hyaenodon") {
        log += "Hyaenodon greift an...<br>";
        // Zufällige Chance für den Skill
        let skillChance = Math.random(); 
        if (skillChance > 0.6) {
          log += "💥 <span style='color:#00f0ff'>Skill aktiviert: Reißende Bisse!</span> Schaden massiv erhöht.<br>";
        } else {
          log += "💚 <span style='color:#00ff66'>Skill aktiviert: Heulende Heilung!</span> Truppen regeneriert.<br>";
        }
      }
      
      log += "Kampf beendet. Sieg!";
      resultDiv.innerHTML = log;
    }
  </script>
</body>
</html>
