<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clan Kampf-Simulator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background-color: #f4f4f9; }
        .input-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; width: 300px; }
        select, input { padding: 8px; width: 100%; box-sizing: border-box; margin-top: 5px; }
        button { padding: 12px 25px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; }
        #ergebnis { margin-top: 20px; font-weight: bold; padding: 15px; border: 1px solid #ccc; border-radius: 5px; background: white; }
    </style>
</head>
<body>

    <h1>Clan Kampf-Simulator</h1>
    
    <div class="input-group">
        <label>Dein Alpha:</label>
        <select id="playerAlphaSelect"><option>Lade Daten...</option></select>
        <input type="number" id="eigeneTruppen" placeholder="Deine Truppenanzahl">
    </div>

    <div class="input-group">
        <label>Gegner Alpha:</label>
        <select id="enemyAlphaSelect"><option>Lade Daten...</option></select>
        <input type="number" id="gegnerTruppen" placeholder="Gegner Truppenanzahl">
    </div>

    <button id="kampfBtn">Kampf simulieren</button>
    <div id="ergebnis">Hier erscheint das Ergebnis...</div>

    <script type="module">
        import CarnivoreAlphas from './data/alphas/carnivores.js';
        import HerbivoreAlphas from './data/alphas/herbivores.js';
        import OmnivoreAlphas from './data/alphas/omnivores.js';
        import BattleManager from './battleManager.js';

        const pSelect = document.getElementById('playerAlphaSelect');
        const eSelect = document.getElementById('enemyAlphaSelect');
        
        // Liste zusammenführen
        const allAlphas = { ...CarnivoreAlphas, ...HerbivoreAlphas, ...OmnivoreAlphas };
        
        // Dropdowns leeren und neu füllen
        pSelect.innerHTML = '';
        eSelect.innerHTML = '';

        Object.entries(allAlphas).forEach(([name, data]) => {
            let opt1 = document.createElement('option');
            opt1.value = data.id;
            opt1.textContent = name;
            pSelect.appendChild(opt1);

            let opt2 = document.createElement('option');
            opt2.value = data.id;
            opt2.textContent = name;
            eSelect.appendChild(opt2);
        });

        document.getElementById('kampfBtn').addEventListener('click', () => {
            const pCount = parseInt(document.getElementById('eigeneTruppen').value) || 0;
            const eCount = parseInt(document.getElementById('gegnerTruppen').value) || 0;
            const ausgabe = document.getElementById('ergebnis');
            
            ausgabe.innerText = "Simuliere Kampf mit " + pCount + " vs " + eCount + " Truppen...";
        });
    </script>
</body>
</html>
