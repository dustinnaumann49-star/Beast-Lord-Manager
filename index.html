<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beast Lord Manager (Serverless)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #e0e0e0; }
    .card { background-color: #1e1e1e; border-color: #333; color: #e0e0e0; }
    .fc-dark { background-color: #2a2a2a; color: #fff; border-color: #444; }
    .fc-dark:focus { background-color: #333; color: #fff; border-color: #ffc107; box-shadow: none; }
    .nav-tabs .nav-link { color: #aaa; border-color: #333; }
    .nav-tabs .nav-link.active { background-color: #1e1e1e; color: #ffc107; border-color: #333 #333 #1e1e1e; }
    .list-group-item { background-color: #222; border-color: #333; color: #fff; }
  </style>
</head>
<body>

<div class="container-fluid py-3">
  <div class="card border-warning mb-4">
    <div class="card-header bg-dark text-warning fw-bold d-flex justify-content-between align-items-center">
      <span>🔐 GitHub API Verbindung</span>
      <span id="syncStatus" class="badge bg-danger">Nicht verbunden</span>
    </div>
    <div class="card-body row g-2">
      <div class="col-md-4">
        <input type="password" id="ghToken" class="form-control form-control-sm fc-dark" placeholder="GitHub Token (ghp_...)">
      </div>
      <div class="col-md-3">
        <input type="text" id="ghUser" class="form-control form-control-sm fc-dark" placeholder="GitHub Nutzername">
      </div>
      <div class="col-md-3">
        <input type="text" id="ghRepo" class="form-control form-control-sm fc-dark" placeholder="Repository Name" value="Beast-Lord-Manager">
      </div>
      <div class="col-md-2">
        <button class="btn btn-warning btn-sm w-100 fw-bold" onclick="saveConfig()">Verbinden</button>
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center gap-3 mb-4">
    <h1 class="mb-0 fw-bold text-warning">🐉 Beast Lord Manager</h1>
    <span class="badge bg-secondary fs-6">GitHub Serverless Edition</span>
  </div>

  <ul class="nav nav-tabs border-secondary mb-4" id="mainTabs">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-beasts">🐾 Bestien</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-alphas">👑 Alphas (Presets)</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-sim">⚔️ Simulation</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-beasts">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card">
            <div class="card-header text-warning fw-bold">➕ Neue Bestie hinzufügen</div>
            <div class="card-body">
              <form id="beastForm">
                <div class="mb-3">
                  <label class="form-label">Name *</label>
                  <input type="text" class="form-control fc-dark" id="bName" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Tier-Stufe</label>
                  <select class="form-select fc-dark" id="bTier">
                    <option selected>IX</option><option>X</option>
                  </select>
                </div>
                <div class="row g-2 mb-3">
                  <div class="col">
                    <label class="form-label">⚔️ Angriff</label>
                    <input type="number" class="form-control fc-dark" id="bAtk" value="1000">
                  </div>
                  <div class="col">
                    <label class="form-label">🛡️ Def</label>
                    <input type="number" class="form-control fc-dark" id="bDef" value="500">
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">❤️ HP</label>
                  <input type="number" class="form-control fc-dark" id="bHp" value="5000">
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Speichern</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card h-100">
            <div class="card-header text-warning fw-bold">📋 Gespeicherte Bestien</div>
            <div class="card-body" id="beastList"><p class="text-muted">Lade Daten...</p></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-alphas">
      <div class="row g-4">
        <div class="col-12">
          <div class="card border-warning mb-4">
            <div class="card-header text-warning fw-bold">📦 Preset Alpha importieren</div>
            <div class="card-body row g-2 align-items-end">
              <div class="col-sm-6">
                <label class="form-label">Vorlage</label>
                <select class="form-select fc-dark" id="presetSelect">
                  <option value="Hyaenodon (S3)">Hyaenodon (S3) [Fleischfresser - Skills fest auf 10]</option>
                </select>
              </div>
              <div class="col-sm-3">
                <label class="form-label">⭐ Sterne (0-8)</label>
                <input type="number" class="form-control fc-dark" id="presetStars" min="0" max="8" value="3">
              </div>
              <div class="col-sm-3">
                <button class="btn btn-warning w-100 fw-bold" onclick="importPreset()">Importieren</button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="card">
            <div class="card-header text-warning fw-bold">📋 Aktive Alphas im System</div>
            <div class="card-body" id="alphaList"><p class="text-muted">Lade Daten...</p></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-sim">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card border-primary">
            <div class="card-header text-primary fw-bold">🟦 Eigenes Team</div>
            <div class="card-body" id="ownTeamEditor"></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card border-danger">
            <div class="card-header text-danger fw-bold">🟥 Gegner Team</div>
            <div class="card-body" id="enemyTeamEditor"></div>
          </div>
        </div>
      </div>
      <div class="mt-4">
        <button class="btn btn-warning btn-lg fw-bold" onclick="runSimulation()">⚔️ Kampf simulieren</button>
        <div id="simResult" class="mt-4 p-3 border border-secondary rounded d-none"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Globaler State
  let config = { token: '', user: '', repo: '' };
  let beasts = [];
  let alphas = [];

  const PRESET_DATA = {
    "Hyaenodon (S3)": {
      name: "Hyaenodon (S3)", food_type: "Carnivore", level: 50,
      skills: Array(8).fill(null).map((_, i) => ({ name: `Skill ${i+1}`, level: 10, max_level: 10 }))
    }
  };

  // Initialisierung beim Laden
  window.addEventListener('DOMContentLoaded', () => {
    loadLocalConfig();
    if(config.token && config.user) {
      initGitHubData();
    }
  });

  function loadLocalConfig() {
    config.token = localStorage.getItem('gh_token') || '';
    config.user = localStorage.getItem('gh_user') || '';
    config.repo = localStorage.getItem('gh_repo') || 'Beast-Lord-Manager';
    
    document.getElementById('ghToken').value = config.token;
    document.getElementById('ghUser').value = config.user;
    document.getElementById('ghRepo').value = config.repo;
  }

  function saveConfig() {
    const token = document.getElementById('ghToken').value.trim();
    const user = document.getElementById('ghUser').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();

    localStorage.setItem('gh_token', token);
    localStorage.setItem('gh_user', user);
    localStorage.setItem('gh_repo', repo);

    config = { token, user, repo };
    initGitHubData();
  }

  async function githubFetch(filename) {
    const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${filename}`;
    try {
      const res = await fetch(url, {
        headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if(res.status === 404) return { sha: null, data: [] };
      const json = await res.json();
      const content = decodeURIComponent(atob(json.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return { sha: json.sha, data: JSON.parse(content) };
    } catch(e) {
      console.error("Fehler beim Laden von " + filename, e);
      return { sha: null, data: [] };
    }
  }

  async function githubSave(filename, data, sha) {
    const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${filename}`;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = { message: `Update ${filename}`, content: content };
    if(sha) body.sha = sha;

    const res = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return res.ok;
  }

  async function initGitHubData() {
    const statusEl = document.getElementById('syncStatus');
    statusEl.className = "badge bg-warning text-dark";
    statusEl.innerText = "Verbinde...";

    const bRes = await githubFetch('beasts.json');
    beasts = bRes.data;
    const aRes = await githubFetch('alphas.json');
    alphas = aRes.data;

    statusEl.className = "badge bg-success";
    statusEl.innerText = "Verbunden";
    
    renderBeasts();
    renderAlphas();
    renderTeamEditors();
  }

  function renderBeasts() {
    const container = document.getElementById('beastList');
    if(beasts.length === 0) {
      container.innerHTML = `<p class="text-muted">Keine Bestien im Repository vorhanden.</p>`;
      return;
    }
    let html = '<div class="list-group">';
    beasts.forEach((b, i) => {
      html += `<div class="list-group-item d-flex justify-content-between align-items-center">
        <div><strong>${b.name}</strong> <span class="text-muted">(Tier ${b.tier})</span><br>
        <small class="text-warning">⚔️ Atk: ${b.attack} | 🛡️ Def: ${b.defense} | ❤️ HP: ${b.hp}</small></div>
        <button class="btn btn-sm btn-danger" onclick="deleteBeast(${i})"><i class="bi bi-trash"></i></button>
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function renderAlphas() {
    const container = document.getElementById('alphaList');
    if(alphas.length === 0) {
      container.innerHTML = `<p class="text-muted">Keine Alphas im Repository vorhanden.</p>`;
      return;
    }
    let html = '<div class="list-group">';
    alphas.forEach((a, i) => {
      html += `<div class="list-group-item d-flex justify-content-between align-items-center">
        <div><strong>${a.name}</strong> <span class="text-warning">⭐ ${a.stars} Sterne</span><br>
        <small class="text-muted">${a.food_type} · Level ${a.level}</small></div>
        <button class="btn btn-sm btn-danger" onclick="deleteAlpha(${i})"><i class="bi bi-trash"></i></button>
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  document.getElementById('beastForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newBeast = {
      name: document.getElementById('bName').value,
      tier: document.getElementById('bTier').value,
      attack: parseInt(document.getElementById('bAtk').value),
      defense: parseInt(document.getElementById('bDef').value),
      hp: parseInt(document.getElementById('bHp').value)
    };
    beasts.push(newBeast);
    const bRes = await githubFetch('beasts.json');
    const ok = await githubSave('beasts.json', beasts, bRes.sha);
    if(ok) { document.getElementById('bName').value = ''; renderBeasts(); renderTeamEditors(); }
  });

  async function deleteBeast(index) {
    beasts.splice(index, 1);
    const bRes = await githubFetch('beasts.json');
    await githubSave('beasts.json', beasts, bRes.sha);
    renderBeasts();
    renderTeamEditors();
  }

  async function importPreset() {
    const key = document.getElementById('presetSelect').value;
    const stars = parseInt(document.getElementById('presetStars').value);
    if(!key) return;
    
    const template = PRESET_DATA[key];
    const newAlpha = JSON.parse(JSON.stringify(template));
    newAlpha.stars = stars;
    
    alphas.push(newAlpha);
    const aRes = await githubFetch('alphas.json');
    const ok = await githubSave('alphas.json', alphas, aRes.sha);
    if(ok) { renderAlphas(); renderTeamEditors(); }
  }

  async function deleteAlpha(index) {
    alphas.splice(index, 1);
    const aRes = await githubFetch('alphas.json');
    await githubSave('alphas.json', alphas, aRes.sha);
    renderAlphas();
    renderTeamEditors();
  }

  function renderTeamEditors() {
    ['ownTeamEditor', 'enemyTeamEditor'].forEach(id => {
      const container = document.getElementById(id);
      let html = '';
      for(let i=1; i<=3; i++) {
        html += `<div class="p-2 mb-2 border border-secondary rounded">
          <h6>Slot ${i}</h6>
          <select class="form-select form-select-sm fc-dark mb-1 ${id}-alpha"><option value="">-- Kein Alpha --</option>`;
          alphas.forEach((a, idx) => { html += `<option value="${idx}">${a.name} (${a.stars}⭐)</option>`; });
        html += `</select>
          <select class="form-select form-select-sm fc-dark mb-1 ${id}-beast"><option value="">-- Keine Bestie --</option>`;
          beasts.forEach((b, idx) => { html += `<option value="${idx}">${b.name}</option>`; });
        html += `</select>
          <input type="number" class="form-control form-control-sm fc-dark ${id}-count" placeholder="Anzahl Einheiten" value="10000">
        </div>`;
      }
      container.innerHTML = html;
    });
  }

  function runSimulation() {
    const resEl = document.getElementById('simResult');
    resEl.className = "mt-4 p-3 border border-primary rounded text-success";
    resEl.innerHTML = `<h5>⚔️ Simulations-Ergebnis</h5>
      <p>Da dies eine Serverless-App ist, läuft die Kampfberechnung nun direkt im Browser.</p>
      <p><strong>Ergebnis:</strong> Unentschieden / Kampfberechnungs-Engine wird im nächsten Schritt finalisiert!</p>`;
    resEl.classList.remove('d-none');
  }
</script>
</body>
</html>
