<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beast Lord Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #e0e0e0; }
    .card { background-color: #1e1e1e; border-color: #333; color: #e0e0e0; }
    .fc-dark { background-color: #2a2a2a; color: #fff; border-color: #444; }
    .log-round { border-left: 3px solid #ffc107; padding: 8px; margin-bottom: 8px; background: #1a1a1a; font-size: 0.9rem; }
    .text-skill { color: #00f0ff; font-weight: bold; }
    .text-heal { color: #00ff66; font-weight: bold; }
  </style>
</head>
<body>

<div class="container-fluid py-3">
  <div class="card border-warning mb-4">
    <div class="card-header bg-dark text-warning fw-bold d-flex justify-content-between">
      <span>🔐 GitHub Verbindung</span>
      <span id="syncStatus" class="badge bg-danger">Nicht verbunden</span>
    </div>
    <div class="card-body row g-2">
      <div class="col-4"><input type="password" id="ghToken" class="form-control form-control-sm fc-dark" placeholder="Token"></div>
      <div class="col-3"><input type="text" id="ghUser" class="form-control form-control-sm fc-dark" placeholder="User"></div>
      <div class="col-3"><input type="text" id="ghRepo" class="form-control form-control-sm fc-dark" value="Beast-Lord-Manager"></div>
      <div class="col-2"><button class="btn btn-warning btn-sm w-100" onclick="saveConfig()">OK</button></div>
    </div>
  </div>

  <ul class="nav nav-tabs border-secondary mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-beasts">🐾 Bestien</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-sim">⚔️ Simulation</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-beasts">
      <div class="card"><div class="card-body" id="beastList">Lade Daten...</div></div>
    </div>
    <div class="tab-pane fade" id="tab-sim">
      <div class="row g-3">
        <div class="col-md-6" id="ownTeamEditor"></div>
        <div class="col-md-6" id="enemyTeamEditor"></div>
      </div>
      <button class="btn btn-warning w-100 mt-3 fw-bold" onclick="runSimulation()">⚔️ Kampf starten</button>
      <div id="simResult" class="mt-3 p-3 border rounded d-none bg-dark"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let beasts = [], alphas = [], config = { token: localStorage.getItem('gh_token'), user: localStorage.getItem('gh_user'), repo: 'Beast-Lord-Manager' };

  async function init() {
    if(config.token && config.user) {
      const bRes = await githubFetch('beasts.json'); beasts = bRes.data;
      const aRes = await githubFetch('alphas.json'); alphas = aRes.data;
      document.getElementById('syncStatus').className = "badge bg-success";
      document.getElementById('syncStatus').innerText = "Verbunden";
      renderEditors();
    }
  }

  function renderEditors() {
    ['own', 'enemy'].forEach(prefix => {
      let html = `<h5 class="text-${prefix==='own'?'primary':'danger'}">${prefix==='own'?'🟦 Dein Team':'🟥 Gegner'}</h5>`;
      for(let i=1; i<=3; i++) {
        html += `<div class="p-2 mb-2 border border-secondary rounded">
          <select class="form-select form-select-sm fc-dark mb-1" id="${prefix}-alpha-${i}" onchange="updateAnalysis('${prefix}')"><option value="">-- Alpha wählen --</option>${alphas.map((a,idx)=>`<option value="${idx}">${a.name}</option>`).join('')}</select>
          <select class="form-select form-select-sm fc-dark mb-1" id="${prefix}-beast-${i}" onchange="updateAnalysis('${prefix}')"><option value="">-- Bestie wählen --</option>${beasts.map((b,idx)=>`<option value="${idx}">${b.name}</option>`).join('')}</select>
        </div>`;
      }
      html += `<div id="${prefix}-analysis" class="small text-muted p-2">Wähle Einheiten für Analyse...</div>`;
      document.getElementById(prefix+'TeamEditor').innerHTML = html;
    });
  }

  function updateAnalysis(prefix) {
    let html = `<strong>Analyse:</strong><br>`, atk = 0, def = 0;
    for(let i=1; i<=3; i++) {
      let aIdx = document.getElementById(prefix+'-alpha-'+i).value;
      if(aIdx !== "") {
        let a = alphas[aIdx];
        html += `👑 ${a.name}: ${a.skills ? a.skills.map(s => s.name).join(', ') : 'Keine Skills'}<br>`;
      }
    }
    document.getElementById(prefix+'-analysis').innerHTML = html;
  }

  // --- HILFSFUNKTIONEN (Fetch/Save gleich wie vorher) ---
  async function githubFetch(f) { /* ...wie gehabt... */ return {data: []}; }
  function saveConfig() { /* ... */ init(); }
  function runSimulation() { /* ...Logik wie vorher... */ }
  
  window.onload = init;
</script>
</body>
</html>
