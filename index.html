<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clan Kampf-Simulator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .input-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; width: 300px; }
    </style>
</head>
<body>

    <h1>Clan Kampf-Simulator</h1>
    <div id="status">Starte Import...</div>

    <div class="input-group">
        <label>Dein Alpha:</label>
        <select id="playerAlphaSelect"><option>Keine Daten</option></select>
    </div>

    <script type="module">
        const statusDiv = document.getElementById('status');
        
        async function ladeDaten() {
            try {
                // Versuche den Import
                const module = await import('./data/alphas/carnivores.js');
                console.log("Import erfolgreich:", module);
                
                const pSelect = document.getElementById('playerAlphaSelect');
                pSelect.innerHTML = ''; // Leeren
                
                // Daten anzeigen
                Object.keys(module.default).forEach(name => {
                    let opt = document.createElement('option');
                    opt.textContent = name;
                    pSelect.appendChild(opt);
                });
                
                statusDiv.innerText = "Daten geladen!";
            } catch (err) {
                statusDiv.innerText = "Fehler: " + err.message;
                console.error("Detail-Fehler:", err);
            }
        }

        ladeDaten();
    </script>
</body>
</html>
