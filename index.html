<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beast Lord Kampf-Sim</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 15px; }
    .box { border: 1px solid #444; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: #1e1e1e; }
    .slot-row { display: grid; grid-template-columns: 1fr 1.5fr 0.7fr; gap: 5px; margin-bottom: 8px; }
    select, input { background: #333; color: #fff; border: 1px solid #555; padding: 6px; font-size: 0.9em; }
    button { background-color: #ffc107; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; }
    #result { margin-top: 15px; padding: 15px; border: 1px solid #555; border-radius: 8px; background: #252525; white-space: pre-wrap; font-size: 0.9em; }
  </style>
</head>
<body>
  <h3>🟦 Dein Team</h3>
  <div class="box" id="teamA"></div>
  <h3>🟥 Gegner Team</h3>
  <div class="box" id="teamB"></div>
  <button onclick="runBattle()">⚔️ Kampf starten</button>
  <div id="result"></div>

  <script>
    const alphas = ["Hyaenodon", "Keiner"];
    const beasts = [
      { name: "Nordwestlicher Wolf", atk: 8, def: 2, hp: 60, type: "Fleischfresser" },
      { name: "Sumatra-Orang-Utan", atk: 6, def: 6, hp: 70, type: "Allesfresser" },
      { name: "Takin", atk: 4, def: 6, hp: 80, type: "Pflanzenfresser" }
    ];

    function createSlots(containerId, prefix) {
      document.getElementById(containerId).innerHTML = Array.from({length: 3}, (_, i) => `
        <div class="slot-row">
          <select id="${prefix}-a-${i+1}">${alphas.map(a => `<option>${a}</option>`).join('')}</select>
          <select id="${prefix}-b-${i+1}">${beasts.map(b => `<option value="${b.name}">${b.name}</option>`).join('')}</select>
          <input type="number" id="${prefix}-c-${i+1}" value="1000">
        </div>`).join('');
    }

    function getStats(prefix) {
      let atk = 0, def = 0, hp = 0;
      let hasHyaenodon = false;
      let hasFleischfresser = false;

      for (let i = 1; i <= 3; i++) {
        let alpha = document.getElementById(`${prefix}-a-${i}`).value;
        let bName = document.getElementById(`${prefix}-b-${i}`).value;
        let count = parseInt(document.getElementById(`${prefix}-c-${i}`).value) || 0;
        let b = beasts.find(obj => obj.name === bName);

        let rowAtk = b.atk * count;
        let rowDef = b.def * count;
        let rowHp = b.hp * count;

        if (alpha === "Hyaenodon") {
          hasHyaenodon = true;
          rowHp *= 1.2; 
          if (i === 1) { rowAtk *= 1.2; rowDef *= 1.2; }
        }
        if (b.type === "Fleischfresser") hasFleischfresser = true;
        
        atk += rowAtk; def += rowDef; hp += rowHp;
      }
      return { atk, def, hp, hasHyaenodon, hasFleischfresser };
    }

    function runBattle() {
      let A = getStats("teamA");
      let B = getStats("teamB");
      let log = "--- Kampf gestartet ---\n";

      for (let r = 1; r <= 10; r++) {
        // Meister der Nachahmung (Hyaenodon-Logik)
        let bonusA = (A.hasHyaenodon && A.hasFleischfresser && Math.random() < 0.7) ? 1.15 : 1.0;
        let bonusB = (B.hasHyaenodon && B.hasFleischfresser && Math.random() < 0.7) ? 1.15 : 1.0;

        let dmgToB = Math.max(0, (A.atk * bonusA) - (B.def * 0.2));
        let dmgToA = Math.max(0, (B.atk * bonusB) - (A.def * 0.2));

        A.hp -= dmgToA;
        B.hp -= dmgToB;

        log += `Runde ${r}: Dein DMG: ${Math.floor(dmgToB * bonusA).toLocaleString()} ${bonusA > 1 ? '(+Nachahmung!)' : ''} | Gegner: ${Math.floor(dmgToA * bonusB).toLocaleString()}\n`;

        if (A.hp <= 0 || B.hp <= 0) break;
      }

      let winner = (A.hp > B.hp) ? "Dein Team hat gewonnen!" : "Der Gegner hat gewonnen!";
      document.getElementById('result').innerText = log + "\n--- " + winner + " ---";
    }

    createSlots("teamA", "teamA");
    createSlots("teamB", "teamB");
  </script>
</body>
</html>
