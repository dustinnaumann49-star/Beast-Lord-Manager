<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beast Lord Kampf-Sim</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; padding: 15px; }
    .box { border: 1px solid #334155; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #1e293b; }
    .slot-row { display: grid; grid-template-columns: 1fr 1fr 1fr 0.5fr; gap: 5px; margin-bottom: 5px; }
    select, input { background: #334155; color: white; border: none; padding: 5px; border-radius: 4px; font-size: 0.8em; }
    button { background: #fbbf24; color: black; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; font-size: 0.75em; }
    th, td { border: 1px solid #334155; padding: 6px; text-align: center; }
    th { background: #334155; color: #fbbf24; }
    .round-info { margin-top: 10px; font-weight: bold; color: #fbbf24; text-align: center; }
  </style>
</head>
<body>
  <h3>🟦 Dein Team</h3>
  <div class="box" id="teamA"></div>
  <h3>🟥 Gegner Team</h3>
  <div class="box" id="teamB"></div>
  <button onclick="runBattle()">⚔️ Kampfbericht erstellen</button>
  <div id="report"></div>

  <script>
    const alphas = ["Smilodon", "Hyaenodon", "Keiner"];
    const beasts = ["Nordwestlicher Wolf", "Sumatra-Orang-Utan", "Takin"];

    function createSlots(containerId, prefix) {
      let html = "";
      for (let i = 1; i <= 3; i++) {
        html += `<div class="slot-row">
          <select id="${prefix}-a-${i}">${alphas.map(a => `<option>${a}</option>`).join('')}</select>
          <select id="${prefix}-b-${i}">${beasts.map(b => `<option>${b}</option>`).join('')}</select>
          <input type="number" id="${prefix}-c-${i}" value="1000">
        </div>`;
      }
      document.getElementById(containerId).innerHTML = html;
    }

    // Jeder Slot prüft nun seine eigene Chance unabhängig
    function processAlphaSlot(alpha, stats) {
      if (alpha === "Smilodon") {
        if (Math.random() < 0.7) { stats.alphaDmg += Math.floor(8000 * 1.4); stats.triggers += 1; }
        if (Math.random() < 0.8) { stats.alphaDmg += Math.floor(8000 * 2.0); stats.triggers += 1; }
      } else if (alpha === "Hyaenodon") {
        if (Math.random() < 0.5) { stats.healing += 5000; stats.triggers += 1; }
      }
    }

    function runBattle() {
      let statsA = { alphaDmg: 0, beastDmg: 0, triggers: 0, healing: 0, units: 3000 };
      let statsB = { alphaDmg: 0, beastDmg: 0, triggers: 0, healing: 0, units: 3000 };
      let finalRound = 0;

      for (let r = 1; r <= 8; r++) {
        finalRound = r;
        
        // Team A: Jeder der 3 Slots würfelt separat
        for(let i=1; i<=3; i++) {
          statsA.beastDmg += 5000;
          processAlphaSlot(document.getElementById(`teamA-a-${i}`).value, statsA);
        }
        statsB.units -= Math.floor((statsA.alphaDmg + statsA.beastDmg - statsB.healing) / 2000);

        // Team B: Jeder der 3 Slots würfelt separat
        for(let i=1; i<=3; i++) {
          statsB.beastDmg += 5000;
          processAlphaSlot(document.getElementById(`teamB-a-${i}`).value, statsB);
        }
        statsA.units = Math.min(3000, statsA.units + Math.floor(statsA.healing / 500));
        statsA.units -= Math.floor((statsB.alphaDmg + statsB.beastDmg) / 2000);

        if (statsA.units <= 0 || statsB.units <= 0) break;
      }

      let html = `<table>
        <tr><th>Team</th><th>Alpha DMG</th><th>Bestien DMG</th><th>Heilung</th><th>Trigger</th><th>Rest 🐾</th><th>Status</th></tr>
        <tr><td>🟦 Dein</td><td>${statsA.alphaDmg.toLocaleString()}</td><td>${statsA.beastDmg.toLocaleString()}</td><td>${statsA.healing.toLocaleString()}</td><td>${statsA.triggers}x</td><td>${Math.max(0, statsA.units)}</td><td>${statsA.units > statsB.units ? "Sieg" : "Niederlage"}</td></tr>
        <tr><td>🟥 Gegner</td><td>${statsB.alphaDmg.toLocaleString()}</td><td>${statsB.beastDmg.toLocaleString()}</td><td>${statsB.healing.toLocaleString()}</td><td>${statsB.triggers}x</td><td>${Math.max(0, statsB.units)}</td><td>${statsB.units > statsA.units ? "Sieg" : "Niederlage"}</td></tr>
      </table>
      <div class="round-info">Kampf beendet nach ${finalRound} Runden</div>`;
      document.getElementById("report").innerHTML = html;
    }

    createSlots("teamA", "teamA");
    createSlots("teamB", "teamB");
  </script>
</body>
</html>
