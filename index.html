<div id="teamAnalysis" class="mt-3 p-3 bg-dark border border-secondary rounded d-none">
  <h6 class="text-warning">🔍 Team-Analyse & Aktive Skills</h6>
  <div id="analysisContent"></div>
</div>

<script>
  // ... (vorheriger Code bleibt gleich) ...

  function updateAnalysis() {
    ['ownTeamEditor', 'enemyTeamEditor'].forEach(prefix => {
      const data = getCompiledTeam(prefix);
      const container = document.getElementById(prefix === 'ownTeamEditor' ? 'analysisContent' : 'analysisContent'); // Vereinfacht für Demo
      
      let html = `<ul class="list-unstyled small text-muted">`;
      html += `<li>⚔️ Gesamt-Atk: ${data.baseAtk.toLocaleString()} | 🛡️ Def: ${data.baseDef.toLocaleString()}</li>`;
      html += `<li>❤️ Gesamt-HP: ${data.maxHp.toLocaleString()}</li>`;
      html += `<li>👑 Aktive Alphas: ${data.alphas.map(a => a.name).join(', ') || 'Keine'}</li>`;
      
      data.alphas.forEach(a => {
        if(a.skills) {
          a.skills.forEach(s => {
            html += `<li class="text-info">• ${a.name}: ${s.name} (${s.chance}%)</li>`;
          });
        }
      });
      html += `</ul>`;
      document.getElementById('analysisContent').innerHTML = html;
      document.getElementById('teamAnalysis').classList.remove('d-none');
    });
  }

  // Ergänze in den <select> Elementen der renderTeamEditors Funktion folgendes Attribut:
  // onchange="updateAnalysis()"
</script>
