<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beast Lord Kampf-Sim</title>
  <style>
    body { margin: 0; padding: 15px; font-family: sans-serif; color: #fff; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; background-attachment: fixed; }
    .box { border: 1px solid #444; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: rgba(0, 0, 0, 0.4); }
    .slot-row { display: grid; grid-template-columns: 1fr 1.5fr 0.7fr; gap: 5px; margin-bottom: 8px; }
    select, input { background: #333; color: #fff; border: 1px solid #555; padding: 6px; font-size: 0.9em; }
    button { background-color: #ffc107; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; }
    #result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; font-family: monospace; background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 8px; }
    .col-header { font-weight: bold; border-bottom: 1px solid #555; padding-bottom: 5px; color: #ffc107; }
    .dmg-row { border-bottom: 1px solid #333; padding: 4px 0; font-size: 0.85em; }
    .win-msg { font-weight: bold; font-size: 1.2em; padding: 10px; text-align: center; color: #ffc107; }
  </style>
</head>
<body>
  <h3>🟦 Dein Team</h3>
  <div class="box" id="teamA"></div>
  <h3>🟥 Gegner Team</h3>
  <div class="box" id="teamB"></div>
  <button onclick="runBattle()">⚔️ Kampf starten</button>
  <div id="result-grid"></div>

  <script>
    const alphas = ["Smilodon", "Hyaenodon", "Keiner"];
    const beasts = [
      { name: "Nordwestlicher Wolf", atk: 8, def: 2, hp: 60 },
      { name: "Sumatra-Orang-Utan", atk: 6, def: 6, hp: 70 },
      { name: "Takin", atk: 4, def: 6, hp: 80 }
    ];

    function createSlots(containerId, prefix) {
      let html = "";
      for (let i = 1; i <= 3; i++) {
        html += `<div class="slot-row">
          <select id="${prefix}-a-${i}">${alphas.map(a => `<option>${a}</option>`).join('')}</select>
          <select id="${prefix}-b-${i}">${beasts.map(b => `<option value="${b.name}">${b.name}</option>`).join('')}</select>
          <input type="number" id="${prefix}-c-${i}" value="1000">
        </div>`;
      }
      document.getElementById(containerId).innerHTML = html;
    }

    function runBattle() {
      let resDiv = document.getElementById('result-grid');
      resDiv.innerHTML = `<div class="col-header">🟦 Dein Team (Bestien)</div><div class="col-header">🟥 Gegner (Bestien)</div>`;
      
      let state = { 
        A: { count: 3000, stacks: 0, dist: 0 }, 
        B: { count: 3000, stacks: 0, dist: 0 } 
      };

      for (let r = 1; r <= 10; r++) {
        let logA = "", logB = "", dmgA = 500, dmgB = 500;

        // Berechnung Schaden (vereinfacht auf Basis der überlebenden Bestien)
        for(let i=1; i<=3; i++) {
            if(document.getElementById("teamA-a-"+i).value === "Smilodon") {
                if(Math.random() < 0.8) { dmgA *= 2.0; state.A.stacks++; logA += "⚡ "; }
                dmgA *= (1 + (state.A.dist * 0.08));
            }
            if(document.getElementById("teamB-a-"+i).value === "Smilodon") {
                if(Math.random() < 0.8) { dmgB *= 2.0; state.B.stacks++; logB += "⚡ "; }
                dmgB *= (1 + (state.B.dist * 0.08));
            }
        }

        // Bestien abziehen
        state.A.count -= Math.floor(dmgB / 10);
        state.B.count -= Math.floor(dmgA / 10);

        resDiv.innerHTML += `<div class="dmg-row">${state.A.count} ${logA}</div>
                             <div class="dmg-row">${state.B.count} ${logB}</div>`;

        if (state.A.count <= 0 || state.B.count <= 0) break;
      }

      let winner = state.A.count > state.B.count ? "🟦 DU HAST GEWONNEN!" : "🟥 GEGNER HAT GEWONNEN!";
      resDiv.innerHTML += `<div class="win-msg" style="grid-column: span 2;">${winner}</div>`;
    }
    
    createSlots("teamA", "teamA");
    createSlots("teamB", "teamB");
  </script>
</body>
</html>
