<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beast Lord Manager</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 15px; }
    .box { border: 1px solid #444; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: #1e1e1e; }
    .slot-row { display: flex; gap: 5px; margin-bottom: 5px; }
    select { background: #333; color: #fff; border: 1px solid #555; padding: 5px; flex: 1; }
    button { background-color: #ffc107; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    .label { font-size: 0.8em; color: #aaa; margin-bottom: 2px; }
  </style>
</head>
<body>
  <h3>🟦 Dein Team</h3>
  <div class="box" id="ownTeam"></div>
  <button onclick="runBattle()">⚔️ Kampf starten</button>
  <div id="result" style="margin-top:15px; color:#ffc107;"></div>

  <script>
    const alphas = ["Hyaenodon"];
    const beasts = [
      { name: "Nordwestlicher Wolf", type: "Fleischfresser" },
      { name: "Sumatra-Orang-Utan", type: "Allesfresser" }
    ];

    function createUI() {
      let html = "";
      for(let i=1; i<=3; i++) {
        html += `
          <div class="label">Slot ${i}</div>
          <div class="slot-row">
            <select id="alpha-${i}">${alphas.map(a => `<option>${a}</option>`).join('')}</select>
            <select id="beast-${i}">${beasts.map(b => `<option value="${b.name}">${b.name} (${b.type})</option>`).join('')}</select>
          </div>`;
      }
      document.getElementById('ownTeam').innerHTML = html;
    }

    function runBattle() {
      let log = "<strong>Kampfbericht:</strong><br>";
      for(let i=1; i<=3; i++) {
        let a = document.getElementById(`alpha-${i}`).value;
        let b = document.getElementById(`beast-${i}`).value;
        log += `Slot ${i}: ${a} führt ${b} in den Kampf.<br>`;
      }
      document.getElementById('result').innerHTML = log;
    }

    createUI();
  </script>
</body>
</html>
