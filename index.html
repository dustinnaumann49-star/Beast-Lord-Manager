<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clan Kampf-Simulator 3v3</title>

    <script src="data/alphas/carnivores.js"></script>
    <script src="data/alphas/herbivores.js"></script>
    <script src="data/alphas/omnivores.js"></script>
    <script src="data/troops/carnivore_troops.js"></script>
    <script src="data/troops/herbivore_troops.js"></script>
    <script src="data/troops/omnivore_troops.js"></script>

    <script src="engine/gameEngine.js"></script>
    <script src="engine/battleManager.js"></script>

    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f4f4f9; }
        .slot { background: white; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 12px; }
        select, input { padding: 10px; width: 100%; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; }
        button { padding: 15px; width: 100%; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Kampf-Simulator 3v3</h1>

    <h3>Deine Armee</h3>
    <div id="p1" class="slot"></div>
    <div id="p2" class="slot"></div>
    <div id="p3" class="slot"></div>

    <h3>Gegner Armee</h3>
    <div id="e1" class="slot"></div>
    <div id="e2" class="slot"></div>
    <div id="e3" class="slot"></div>

    <button id="kampfBtn">Kampf starten</button>

    <script>
        window.onload = function() {
            // Daten zusammenführen
            const allAlphas = { 
                ...window.CarnivoreAlphas, 
                ...window.Herbivores, 
                ...window.Omnivores 
            };
            
            const allTroops = { 
                Carnivore: window.CarnivoreTroops, 
                Herbivore: window.HerbivoreTroops, 
                Omnivore: window.OmnivoreTroops 
            };
            
            GameEngine.allAlphas = allAlphas;

            function setupSlot(id) {
                const el = document.getElementById(id);
                if (!el) return;
                
                el.innerHTML = `
                    <select class="aSel"><option value="">Wähle Alpha</option></select>
                    <select class="tSel" disabled><option>Erst Alpha wählen</option></select>
                    <input type="number" class="cIn" placeholder="Anzahl">
                `;
                
                const aSel = el.querySelector('.aSel');
                const tSel = el.querySelector('.tSel');

                // Alphas befüllen
                Object.keys(allAlphas).forEach(name => {
                    let o = document.createElement('option'); 
                    o.value = name; 
                    o.textContent = name;
                    // Wir speichern den Typ im Attribut, um ihn später leicht zu finden
                    o.dataset.class = allAlphas[name].class; 
                    aSel.appendChild(o);
                });

                // Logik: Truppen bei Alpha-Wahl filtern
                aSel.onchange = function() {
                    tSel.innerHTML = '<option value="">Wähle Truppe</option>';
                    const selectedType = this.options[this.selectedIndex].dataset.type;
                    
                    if (selectedType && allTroops[selectedType]) {
                        tSel.disabled = false;
                        Object.keys(allTroops[selectedType]).forEach(tier => {
                            Object.keys(allTroops[selectedType][tier]).forEach(troopName => {
                                let o = document.createElement('option');
                                o.value = troopName;
                                o.textContent = `${troopName} (${tier})`;
                                tSel.appendChild(o);
                            });
                        });
                    } else {
                        tSel.disabled = true;
                        tSel.innerHTML = '<option>Nicht kompatibel</option>';
                    }
                };
            }

            ['p1','p2','p3','e1','e2','e3'].forEach(setupSlot);

            document.getElementById('kampfBtn').onclick = () => {
                alert("Simulation mit gewählten Truppen gestartet!");
            };
        };
    </script>
</body>
</html>
