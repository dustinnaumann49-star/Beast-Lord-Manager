<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clan Kampf-Simulator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .input-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; width: 300px; }
        select, input { padding: 8px; width: 100%; box-sizing: border-box; margin-top: 5px; }
        button { padding: 12px; background: #28a745; color: white; border: none; cursor: pointer; width: 100%; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Clan Kampf-Simulator</h1>

    <div class="input-group">
        <label>Dein Alpha:</label>
        <select id="pAlphaSelect"></select>
        <label>Deine Truppen:</label>
        <select id="pTroopSelect"></select>
    </div>

    <div class="input-group">
        <label>Gegner Alpha:</label>
        <select id="eAlphaSelect"></select>
        <label>Gegner Truppen:</label>
        <select id="eTroopSelect"></select>
    </div>

    <button id="kampfBtn">Kampf simulieren</button>
    <div id="ergebnis" style="margin-top:20px; font-weight:bold;"></div>

    <script type="module">
        import CarnivoreAlphas from './data/alphas/carnivores.js';
        import HerbivoreAlphas from './data/alphas/herbivores.js';
        import OmnivoreAlphas from './data/alphas/omnivores.js';
        
        import CarnivoreTroops from './data/troops/carnivore_troops.js';
        import HerbivoreTroops from './data/troops/herbivore_troops.js';
        import OmnivoreTroops from './data/troops/omnivore_troops.js';

        // 1. Alpha-Daten-Map erstellen
        const alphaMap = {
            ...Object.keys(CarnivoreAlphas || {}).reduce((a, k) => ({...a, [k]: 'carnivore'}), {}),
            ...Object.keys(HerbivoreAlphas || {}).reduce((a, k) => ({...a, [k]: 'herbivore'}), {}),
            ...Object.keys(OmnivoreAlphas || {}).reduce((a, k) => ({...a, [k]: 'omnivore'}), {})
        };

        function initDropdown(alphaEl, troopEl) {
            // Alphas füllen
            Object.keys(alphaMap).forEach(name => {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                alphaEl.appendChild(opt);
            });

            // Truppen basierend auf Typ füllen
            alphaEl.addEventListener('change', () => {
                const type = alphaMap[alphaEl.value];
                const source = (type === 'carnivore') ? CarnivoreTroops : 
                               (type === 'herbivore') ? HerbivoreTroops : OmnivoreTroops;
                
                troopEl.innerHTML = '';
                Object.keys(source || {}).forEach(tier => {
                    const group = document.createElement('optgroup');
                    group.label = tier;
                    Object.keys(source[tier] || {}).forEach(name => {
                        let opt = document.createElement('option');
                        opt.textContent = name;
                        group.appendChild(opt);
                    });
                    troopEl.appendChild(group);
                });
            });
            alphaEl.dispatchEvent(new Event('change')); // Init
        }

        initDropdown(document.getElementById('pAlphaSelect'), document.getElementById('pTroopSelect'));
        initDropdown(document.getElementById('eAlphaSelect'), document.getElementById('eTroopSelect'));

        document.getElementById('kampfBtn').addEventListener('click', () => {
            document.getElementById('ergebnis').innerText = "Bereit zur Simulation.";
        });
    </script>
</body>
</html>
