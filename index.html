<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clan Kampf-Simulator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .input-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; width: 300px; }
        select, input { padding: 8px; width: 100%; box-sizing: border-box; margin-top: 5px; }
        button { padding: 12px 25px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Clan Kampf-Simulator</h1>

    <div class="input-group">
        <label>Dein Alpha:</label>
        <select id="pAlphaSelect"></select>
        <label>Deine Truppen:</label>
        <select id="pTroopSelect"></select>
        <input type="number" id="eigeneTruppen" placeholder="Anzahl">
    </div>

    <div class="input-group">
        <label>Gegner Alpha:</label>
        <select id="eAlphaSelect"></select>
        <label>Gegner Truppen:</label>
        <select id="eTroopSelect"></select>
        <input type="number" id="gegnerTruppen" placeholder="Anzahl">
    </div>

    <button id="kampfBtn">Kampf simulieren</button>
    <div id="ergebnis" style="margin-top:20px; font-weight:bold;"></div>

    <script type="module">
        import CarnivoreAlphas from './data/alphas/carnivores.js';
        import CarnivoreTroops from './data/troops/carnivore_troops.js';

        // 1. Alphas befüllen
        const pAlpha = document.getElementById('pAlphaSelect');
        const pTroop = document.getElementById('pTroopSelect');

        Object.entries(CarnivoreAlphas).forEach(([name, data]) => {
            let opt = document.createElement('option');
            opt.value = data.id;
            opt.textContent = name;
            pAlpha.appendChild(opt);
        });

        // 2. Truppen-Update-Funktion
        function updateTroops() {
            pTroop.innerHTML = '';
            // Hier greifen wir auf die Truppen zu, die zu den Fleischfressern passen
            Object.keys(CarnivoreTroops["T10"]).forEach(troopName => {
                let opt = document.createElement('option');
                opt.textContent = troopName;
                pTroop.appendChild(opt);
            });
        }

        // 3. Wenn sich der Alpha ändert, Truppen aktualisieren
        pAlpha.addEventListener('change', updateTroops);
        
        // Initialer Aufruf
        updateTroops();

        document.getElementById('kampfBtn').addEventListener('click', () => {
            document.getElementById('ergebnis').innerText = "Berechne: " + pAlpha.value + " mit " + pTroop.value;
        });
    </script>
</body>
</html>
