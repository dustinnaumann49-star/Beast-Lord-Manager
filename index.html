<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beast Lord Kampf-Sim</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 15px; }
    .box { border: 1px solid #444; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: #1e1e1e; }
    .slot-row { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
    select { background: #333; color: #fff; border: 1px solid #555; padding: 6px; flex: 1; }
    button { background-color: #ffc107; color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }
    #result { margin-top: 15px; padding: 10px; border-top: 1px solid #333; color: #ffc107; line-height: 1.4; }
  </style>
</head>
<body>
  <h3>🟦 Dein Team</h3>
  <div class="box" id="teamContainer"></div>
  <button onclick="calculateBattle()">⚔️ Kampf berechnen</button>
  <div id="result"></div>

  <script>
    // Datenbank der Bestien
    const beasts = [
      { name: "Nordwestlicher Wolf", type: "Fleischfresser", atk: 105, def: 49, hp: 13 },
      { name: "Sumatra-Orang-Utan", type: "Allesfresser", atk: 87, def: 49, hp: 18 }
    ];

    function initUI() {
      const container = document.getElementById('teamContainer');
      let html = "";
      for(let i=1; i<=3; i++) {
        html += `
          <div class="slot-row">
            <span>Slot ${i}:</span>
            <select id="beast-${i}">
              ${beasts.map(b => `<option value="${b.name}">${b.name}</option>`).join('')}
            </select>
          </div>`;
      }
      container.innerHTML = html;
    }

    function calculateBattle() {
      let totalAtk = 0, totalDef = 0, totalHP = 0;
      
      for(let i=1; i<=3; i++) {
        let name = document.getElementById(`beast-${i}`).value;
        let b = beasts.find(obj => obj.name === name);
        totalAtk += b.atk;
        totalDef += b.def;
        totalHP += b.hp;
      }
      
      document.getElementById('result').innerHTML = `
        <strong>Kampf-Analyse (Team-Werte):</strong><br>
        Gesamt-Angriff: ${totalAtk}<br>
        Gesamt-Verteidigung: ${totalDef}<br>
        Gesamt-HP: ${totalHP}
      `;
    }

    initUI();
  </script>
</body>
</html>
