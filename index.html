<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clan Kampf-Simulator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .input-group { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; width: 300px; }
        select, input { padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Clan Kampf-Simulator</h1>

    <div class="input-group">
        <label>Dein Alpha:</label>
        <select id="pAlphaSelect"></select>
        <label>Deine Truppe:</label>
        <select id="pTroopSelect"></select>
        <input type="number" id="pCount" placeholder="Anzahl">
    </div>

    <div class="input-group">
        <label>Gegner Alpha:</label>
        <select id="eAlphaSelect"></select>
        <label>Gegner Truppe:</label>
        <select id="eTroopSelect"></select>
        <input type="number" id="eCount" placeholder="Anzahl">
    </div>

    <button id="kampfBtn">Kampf simulieren</button>
    <div id="ergebnis" style="margin-top:20px; font-weight:bold;"></div>

    <script type="module">
        import CarnivoreAlphas from './data/alphas/carnivores.js';
        import CarnivoreTroops from './data/troops/carnivore_troops.js';
        // ... (entsprechend für Herbivore/Omnivore hinzufügen)

        // Mapping: Welches Alpha gehört zu welchem Truppentyp?
        const alphaToType = { ...CarnivoreAlphas }; // Hier alle Alphas mappen

        function updateTroopDropdown(alphaSelect, troopSelect) {
            troopSelect.innerHTML = '';
            // Logik: Lade Truppen basierend auf dem gewählten Alpha-Typ
            // Hier ein vereinfachtes Beispiel:
            Object.keys(CarnivoreTroops["T10"]).forEach(troopName => {
                let opt = document.createElement('option');
                opt.textContent = troopName;
                troopSelect.appendChild(opt);
            });
        }

        document.getElementById('pAlphaSelect').addEventListener('change', (e) => {
            updateTroopDropdown(e.target, document.getElementById('pTroopSelect'));
        });

        // Initiales Laden...
    </script>
</body>
</html>
